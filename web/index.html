<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RCR · Remote code review</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header><div><h1>RCR <span>Remote code review</span></h1><p id="repository">Loading repository…</p></div><button id="refresh" type="button">↻ Refresh</button></header>
  <div class="toolbar"><span id="summary" role="status">Loading changes…</span><span id="updated"></span></div>
  <p id="error" role="alert" hidden></p>
  <main><nav id="files" aria-label="Changed files"></nav><section id="diffs" aria-label="Diffs"></section></main>
</body>
</html>
