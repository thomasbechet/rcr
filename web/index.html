<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RCR · Remote code review</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <h1 title="Remote code review">RCR</h1>
    <p id="repository">Loading repository…</p>
    <div class="view-switch" role="group" aria-label="View"><button id="changes-view" type="button" aria-pressed="true">Changes</button><button id="files-view" type="button" aria-pressed="false">Files</button></div>
    <span id="summary" role="status">Loading changes…</span>
    <span id="updated"></span>
    <button id="refresh" type="button">↻ Refresh</button>
  </header>
  <p id="error" role="alert" hidden></p>
  <main><nav id="files" aria-label="Changed files"></nav><section id="diffs" aria-label="Diffs" aria-busy="false"></section></main>
</body>
</html>
